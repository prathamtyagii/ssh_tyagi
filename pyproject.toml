[project]
name = "sshtyagi"
version = "0.1.0"
description = "ssh tyagi.web -- a read-only interactive SSH portfolio"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14.2",
    "textual>=0.60.0",
    "ptyprocess>=0.7.0",
    "httpx>=0.27.0",
    "pyfiglet>=1.0.2",
    "Pillow>=10.0.0",
]

[project.scripts]
sshtyagi-gateway = "sshtyagi.gateway:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sshtyagi*"]
